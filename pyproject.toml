[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domainfinder"
dynamic = ["version"]
description = "Find additional domains owned by the same company as a seed domain, with evidence."
readme = "docs/README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "idna>=3.4",
    "dnspython>=2.6",
    "tldextract>=5.1",
    "cryptography>=42",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
domainfinder = "domainfinder.cli:main"

[tool.setuptools.dynamic]
version = { attr = "domainfinder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
domainfinder = ["data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
